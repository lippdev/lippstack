name: Vendor drift

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Sync vendored design skills
        id: sync
        run: |
          {
            echo 'log<<EOF'
            ./scripts/sync-vendor.sh
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/sync-vendor
          title: Sync vendored design skills
          commit-message: Sync vendored design skills from upstream
          body: |
            `scripts/sync-vendor.sh` found upstream changes.

            ```
            ${{ steps.sync.outputs.log }}
            ```

            Before merging: update the commits in `plugins/design-skills/README.md` and bump `design-skills` in `plugin.json` and `.claude-plugin/marketplace.json` (CI checks they match).
          delete-branch: true
