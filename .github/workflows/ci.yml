name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Repo consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/check.mjs

  shell:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck setup.sh scripts/*.sh plugins/po-skills/skills/brainstorming/scripts/*.sh

  powershell:
    name: PowerShell lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse setup.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\setup.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path setup.ps1 -Severity Error
          $issues | Format-Table -AutoSize
          if ($issues) { exit 1 }

  plugins:
    name: Validate and test plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace and plugins
        run: |
          claude plugin validate .
          for p in plugins/*/; do claude plugin validate "$p"; done
      - name: Test mods
        run: |
          for p in plugins/*/; do
            if [ -d "$p/tests" ]; then echo "::group::$p"; claude plugin test "$p"; echo "::endgroup::"; fi
          done

  skills-portable:
    name: Skills install for other agents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install every skill for Codex and Gemini CLI
        run: |
          expected=$(find plugins/*/skills -mindepth 2 -maxdepth 2 -name SKILL.md | wc -l)
          work=$(mktemp -d)
          (cd "$work" && git init -q && npx -y skills add "$GITHUB_WORKSPACE" -a codex -a gemini-cli --skill '*' --copy -y)
          got=$(find "$work" -name SKILL.md | sort -u | xargs -n1 dirname | xargs -n1 basename | sort -u | wc -l)
          echo "expected $expected skills, installed $got"
          test "$expected" -eq "$got"

  install-smoke:
    name: Install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - name: setup.sh --agents codex
        if: runner.os != 'Windows'
        run: ./setup.sh --agents codex
      - name: setup.ps1 -Agents codex
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\setup.ps1 -Agents codex
      - name: Every lippstack plugin is installed for Claude Code
        shell: bash
        run: |
          claude plugin list > installed.txt
          node -e '
            const fs = require("fs")
            const list = fs.readFileSync("installed.txt", "utf8")
            // Listed in the marketplace but left out of the installers on purpose.
            const optional = ["video-editor-skills"]
            const names = JSON.parse(fs.readFileSync(".claude-plugin/marketplace.json", "utf8")).plugins.map(p => p.name).filter(n => !optional.includes(n))
            const missing = names.filter(n => !list.includes(`${n}@lippstack`))
            if (missing.length) { console.error("not installed:", missing.join(", ")); process.exit(1) }
            console.log(`all ${names.length} lippstack plugins installed`)
          '
      - name: Skills were installed for Codex
        shell: bash
        run: |
          n=$(find "$HOME/.agents/skills" -name SKILL.md | wc -l)
          echo "$n skills in ~/.agents/skills"
          test "$n" -ge 30
